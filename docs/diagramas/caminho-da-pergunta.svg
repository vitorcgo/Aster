<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 500" width="1232" height="500" role="img" aria-label="Fluxograma do caminho de uma pergunta no Aster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a2a86"/><stop offset="1" stop-color="#061a5c"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#c3d6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#d5ff6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1232" height="500" rx="22" fill="url(#bg)"/>
  <text x="36" y="48" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">O caminho de uma pergunta</text>
  <text x="36" y="72" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#c3d6ff">Cada caixa vira um bloco na tela, no momento em que acontece</text>
  <rect x="36" y="108" width="190" height="96" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.32)" stroke-width="1.4"/>
  <circle cx="60" cy="133" r="11" fill="#d5ff6e"/>
  <text x="60" y="137.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#17260a">1</text>
  <text x="80" y="138" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Pergunta</text>
  <text x="52" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">O aluno escreve</text>
  <text x="52" y="181" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">em português comum</text>
  <rect x="266" y="108" width="200" height="96" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.32)" stroke-width="1.4"/>
  <circle cx="290" cy="133" r="11" fill="#d5ff6e"/>
  <text x="290" y="137.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#17260a">2</text>
  <text x="310" y="138" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Proteções</text>
  <text x="282" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">Limite por minuto</text>
  <text x="282" y="181" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">CPF, cartão e e-mail ocultos</text>
  <rect x="506" y="108" width="220" height="96" rx="14" fill="#d5ff6e" stroke="#d5ff6e" stroke-width="1.4"/>
  <circle cx="530" cy="133" r="11" fill="#17260a"/>
  <text x="530" y="137.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#d5ff6e">3</text>
  <text x="550" y="138" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#17260a">Agente de IA</text>
  <text x="522" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#33491a">O modelo escolhe</text>
  <text x="522" y="181" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#33491a">o próximo passo</text>
  <rect x="766" y="108" width="200" height="96" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.32)" stroke-width="1.4"/>
  <circle cx="790" cy="133" r="11" fill="#d5ff6e"/>
  <text x="790" y="137.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#17260a">5</text>
  <text x="810" y="138" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Verificação</text>
  <text x="782" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">Só vale citar fonte</text>
  <text x="782" y="181" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">que a IA recebeu</text>
  <rect x="1006" y="108" width="190" height="96" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.32)" stroke-width="1.4"/>
  <circle cx="1030" cy="133" r="11" fill="#d5ff6e"/>
  <text x="1030" y="137.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" fill="#17260a">6</text>
  <text x="1050" y="138" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Resposta</text>
  <text x="1022" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">Texto com citações</text>
  <text x="1022" y="181" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">clicáveis</text>
  <path d="M228,156 L262,156" fill="none" stroke="#c3d6ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M468,156 L502,156" fill="none" stroke="#c3d6ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M728,156 L762,156" fill="none" stroke="#c3d6ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M968,156 L1002,156" fill="none" stroke="#c3d6ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="330" y="292" width="572" height="156" rx="18" fill="rgba(2,14,44,0.42)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-dasharray="4 6"/>
  <rect x="350" y="308" width="170" height="92" rx="14" fill="rgba(2,14,44,0.55)" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>
  <text x="366" y="338" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Buscar nas aulas</text>
  <text x="366" y="362" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">12 PDFs, 2.277 trechos</text>
  <rect x="532" y="308" width="170" height="92" rx="14" fill="rgba(2,14,44,0.55)" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>
  <text x="548" y="338" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Ler a página</text>
  <text x="548" y="362" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">Texto e trechos citáveis</text>
  <rect x="714" y="308" width="170" height="92" rx="14" fill="rgba(2,14,44,0.55)" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>
  <text x="730" y="338" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Pesquisar na web</text>
  <text x="730" y="362" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c3d6ff">Até 3 por pergunta</text>
  <text x="616" y="430" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" fill="#d5ff6e">4  ferramentas que o agente pode chamar</text>
  <path d="M570,206 Q500,240 470,304" fill="none" stroke="#d5ff6e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-lime)"/>
  <path d="M650,304 Q672,256 640,208" fill="none" stroke="#d5ff6e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-lime)"/>
  <text x="462" y="250" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12" fill="#d5ff6e">pede</text>
  <text x="676" y="262" text-anchor="start" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12" fill="#d5ff6e">recebe o resultado</text>
  <path d="M866,206 Q800,232 730,206" fill="none" stroke="#c3d6ff" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="880" y="232" text-anchor="start" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="11.5" fill="#c3d6ff">recusou? corrige</text>
  <text x="616" y="478" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="12.5" fill="#c3d6ff">o ciclo se repete por até 8 passos e 90 segundos</text>
</svg>
